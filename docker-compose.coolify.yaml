# Deployed by Coolify as this repo's docker_compose_location. Unlike docker-compose.yaml,
# this does NOT bundle its own Postgres — it connects to this tenant's shared `postgresql`
# instance (see the postgresql repo) using a dedicated `metamcp` database inside it. Joins
# the `coolify` external network for both Traefik routing and to reach `postgresql` by
# service name.
services:
  app:
    image: ghcr.io/metatool-ai/metamcp:2.4.22
    env_file:
      - .env
    # No `ports:` mapping on purpose. Publishing 12008 on the host would expose
    # the app in plaintext on the server's public IP, bypassing Traefik, TLS and
    # Cloudflare. Traefik reaches the container over the `coolify` network and
    # auto-selects the image's single EXPOSEd port (12008).
    environment:
      POSTGRES_HOST: postgresql
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: metamcp
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/metamcp
      APP_URL: ${APP_URL:?APP_URL must be set}
      NEXT_PUBLIC_APP_URL: ${APP_URL:?APP_URL must be set}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL: "true"
    restart: unless-stopped
    volumes:
      - uv_cache:/home/nextjs/.cache/uv
    networks:
      - coolify
    # Security hardening (OWASP Docker Security Cheat Sheet), validated against a fully
    # isolated test copy (own throwaway Postgres, real signup/DB write confirmed working)
    # before landing on this live, real-user instance:
    # - cap_drop: ALL — the image already runs as a non-root user (nextjs) by its own
    #   Dockerfile USER directive and needs no special Linux capabilities.
    # - No read_only here, deliberately: this app writes to multiple package-manager caches
    #   at runtime (pnpm's store under /home/nextjs/.local, not just the declared uv_cache
    #   volume) as part of dynamically installing MCP servers — the exact write surface
    #   depends on which MCP servers a user configures, which isn't fully enumerable ahead
    #   of time. Getting read_only wrong here risks breaking a live user's workflow, so it's
    #   skipped rather than guessed at.
    # - No healthcheck override: the image already bakes one in
    #   (curl -f http://localhost:12008/health), confirmed via `docker inspect`.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uv_cache:

networks:
  coolify:
    external: true
