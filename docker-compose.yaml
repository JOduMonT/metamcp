services:
  app:
    image: ghcr.io/metatool-ai/metamcp:2.4.22
    env_file:
      - .env
    ports:
      - "12008:12008"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-metamcp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-m3t4mcp}
      POSTGRES_DB: ${POSTGRES_DB:-metamcp_db}
      DATABASE_URL: postgresql://${POSTGRES_USER:-metamcp_user}:${POSTGRES_PASSWORD:-m3t4mcp}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-metamcp_db}
      APP_URL: ${APP_URL:-http://localhost:12008}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:12008}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      TRANSFORM_LOCALHOST_TO_DOCKER_INTERNAL: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    volumes:
      - uv_cache:/home/nextjs/.cache/uv
    # Security hardening (OWASP Docker Security Cheat Sheet), validated against a fully
    # isolated test copy (own throwaway Postgres, real signup/DB write confirmed working)
    # before landing on the live, real-user instance:
    # - cap_drop: ALL — the image already runs as a non-root user (nextjs) by its own
    #   Dockerfile USER directive and needs no special Linux capabilities.
    # - No read_only here, deliberately: this app writes to multiple package-manager caches
    #   at runtime (pnpm's store under /home/nextjs/.local, not just the declared uv_cache
    #   volume) as part of dynamically installing MCP servers — the exact write surface
    #   depends on which MCP servers a user configures, which isn't fully enumerable ahead
    #   of time. Getting read_only wrong here risks breaking a live user's workflow, so it's
    #   skipped rather than guessed at. Revisit if/when the app's runtime write paths are
    #   fully documented upstream.
    # - No healthcheck override: the image already bakes one in
    #   (curl -f http://localhost:12008/health), confirmed via `docker inspect`.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metamcp_db}
      POSTGRES_USER: ${POSTGRES_USER:-metamcp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-m3t4mcp}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metamcp_user} -d ${POSTGRES_DB:-metamcp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Same hardening as the shared postgresql repo's standalone file — see there for why
    # each value is exactly what it is (validated against real fresh-init and restart
    # scenarios).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  uv_cache:
